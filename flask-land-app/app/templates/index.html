<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Propiedades - Mi Empresa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- Cabecera -->
    <header class="navbar">
        <div class="logo">
            <a href="{{ url_for('main.filtrar_propiedades') }}">
                <img src="{{ url_for('static', filename='logoYM.png') }}" alt="Logo de la Empresa">
            </a>
        </div>
        <nav>
            <a href="{{ url_for('main.index') }}">Inicio</a>
            <a href="#" onclick="openModal('loginModal')">Iniciar Sesión</a>
            <a href="{{ url_for('main.contacto') }}">Contacto</a>
        </nav>
    </header>

    <!-- Modal de Iniciar Sesión -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('loginModal')">&times;</span>
            <p>MY Propiedades</p>
            <h2>Iniciar Sesión</h2>
            <form action="{{ url_for('main.iniciar_sesion') }}" method="POST">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
            <p>¿No tienes una cuenta? <a href="#" onclick="switchModal('loginModal', 'registerModal')">Regístrate aquí</a></p>
        </div>
    </div>

    <!-- Modal de Registro -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('registerModal')">&times;</span>
            <p>MY Propiedades</p>
            <h2>Registro</h2>
            <form action="{{ url_for('main.registrarse') }}" method="POST">
                <label for="new_username">Usuario:</label>
                <input type="text" id="new_username" name="new_username" required>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
                <label for="new_password">Contraseña:</label>
                <input type="password" id="new_password" name="new_password" required>
                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
            <p>¿Ya tienes una cuenta? <a href="#" onclick="switchModal('registerModal', 'loginModal')">Inicia Sesión aquí</a></p>
        </div>
    </div>

    <section class="hero">
        <div class="hero-text">
            <h1>Encuentra la propiedad de tus sueños</h1>
            <p>Explora terrenos, casas, departamentos.</p>
        </div>
    </section>

    <div class="Titulo_filtro">
        <h1>Propiedades Disponibles</h1>
    </div>

    <section class="filters" id="filter-section">
        <form id="filter-form" action="{{ url_for('main.filtrar_propiedades') }}" method="GET">
            <label for="filtro">Filtrar Principalmente por:</label>
            <select name="filtro" id="filtro" onchange="this.form.submit()">
                <option value="">-- Todos --</option>
                <option value="departamento" {% if filtro and filtro == 'departamento' %}selected{% endif %}>Departamento y Ciudad</option>
                <option value="ciudad" {% if filtro and filtro == 'ciudad' %}selected{% endif %}>Solo Ciudad (Todas)</option>
            </select>

            <div>
                <label for="departamento_id">Departamento:</label>
                <select name="departamento_id" id="departamento_id" onchange="this.form.submit()">
                    <option value="">-- Todos los Departamentos --</option>
                    {% for departamento in departamentos %}
                        <option value="{{ departamento.id }}" {% if departamento_id and departamento_id == departamento.id|string %}selected{% endif %}>{{ departamento.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="ciudad_id">Ciudad:</label>
                <select name="ciudad_id" id="ciudad_id" onchange="this.form.submit()">
                    <option value="">-- Todas las Ciudades --</option>
                    {% if departamento_id and ciudades_por_departamento %}
                        {% for ciudad_obj in ciudades_por_departamento %}
                            <option value="{{ ciudad_obj.id }}" {% if ciudad_id and ciudad_id == ciudad_obj.id|string %}selected{% endif %}>{{ ciudad_obj.nombre }} ({{ ciudad_obj.departamento_nombre  }})</option>
                        {% endfor %}
                    {% elif filtro and filtro == 'ciudad' and ciudades %}
                        {% for ciudad_obj in ciudades %}
                            <option value="{{ ciudad_obj.id }}" {% if ciudad_id and ciudad_id == ciudad_obj.id|string %}selected{% endif %}>{{ ciudad_obj.nombre }} ({{ ciudad_obj.departamento_nombre  }})</option>
                        {% endfor %}
                    {% elif not departamento_id and ciudades %}
                        {% for ciudad_obj in ciudades %}
                            <option value="{{ ciudad_obj.id }}" {% if ciudad_id and ciudad_id == ciudad_obj.id|string %}selected{% endif %}>{{ ciudad_obj.nombre }} ({{ ciudad_obj.departamento_nombre  }})</option>
                        {% endfor %}
                    {% endif %}
                </select>
            </div>

            <label for="tipo_operacion">Tipo de Operación:</label>
            <select name="tipo_operacion" id="tipo_operacion" onchange="this.form.submit()">
                <option value="indistinto" {% if tipo_operacion and tipo_operacion == 'indistinto' %}selected{% endif %}>Indistinto</option>
                <option value="venta" {% if tipo_operacion and tipo_operacion == 'venta' %}selected{% endif %}>Venta</option>
                <option value="alquiler" {% if tipo_operacion and tipo_operacion == 'alquiler' %}selected{% endif %}>Alquiler</option>
            </select>

            <label for="tipo_propiedad">Tipo de Propiedad:</label>
            <select name="tipo_propiedad" id="tipo_propiedad" onchange="this.form.submit()">
                <option value="indistinto" {% if tipo_propiedad and tipo_propiedad == 'indistinto' %}selected{% endif %}>Indistinto</option>
                <option value="terreno" {% if tipo_propiedad and tipo_propiedad == 'terreno' %}selected{% endif %}>Terreno</option>
                <option value="departamento" {% if tipo_propiedad and tipo_propiedad == 'departamento' %}selected{% endif %}>Departamento</option>
                <option value="casa" {% if tipo_propiedad and tipo_propiedad == 'casa' %}selected{% endif %}>Casa</option>
                <option value="quinta" {% if tipo_propiedad and tipo_propiedad == 'quinta' %}selected{% endif %}>Quinta</option>
                <option value="deposito" {% if tipo_propiedad and tipo_propiedad == 'deposito' %}selected{% endif %}>Depósito</option>
            </select>

            <div style="margin-top: 10px; margin-bottom: 10px;">
                <label for="precio_min">Precio Mínimo:</label>
                <input type="number" name="precio_min" id="precio_min" value="{{ precio_min_val if precio_min_val is not none else '' }}" placeholder="Mínimo" onchange="this.form.submit()" style="width: 100px;">

                <label for="precio_max" style="margin-left: 10px;">Precio Máximo:</label>
                <input type="number" name="precio_max" id="precio_max" value="{{ precio_max_val if precio_max_val is not none else '' }}" placeholder="Máximo" onchange="this.form.submit()" style="width: 100px;">

                <label for="moneda_filtro_id" style="margin-left: 10px;">Moneda del Filtro:</label>
                <select name="moneda_filtro_id" id="moneda_filtro_id" onchange="this.form.submit()">
                    <option value="">Gs. (por defecto)</option>
                    {% for moneda_c in monedas_cotizacion %}
                        {% if moneda_c.tipo_moneda and moneda_c.tipo_moneda.upper() != 'GS.' %}
                            <option value="{{ moneda_c.id }}" {% if moneda_filtro_id_selected and moneda_filtro_id_selected == moneda_c.id|string %}selected{% endif %}>{{ moneda_c.tipo_moneda }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn-filter-search">Buscar</button>
            <button type="button" onclick="window.location.href='{{ url_for('main.filtrar_propiedades') }}'">Limpiar Filtro</button>
        </form>
    </section>

    <!-- ... sección de resultados y pie de página ... (sin cambios en esta parte) -->
</body>
</html>
